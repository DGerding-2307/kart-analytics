<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kart Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15151E;--panel:#1F1F2B;--panel2:#262634;--line:#33334a;--text:#F3F3F7;--muted:#9a9ab0;
  --red:#E10600;--green:#00D26A;--purple:#A855F7;--yellow:#FFD12E;--blue:#3B82F6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Titillium Web',system-ui,Arial,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:3px solid var(--red);background:#101018;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px;font-style:italic}
.logo span{color:var(--red)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite}
.dot.off{background:var(--red)}
@keyframes pulse{50%{opacity:.4}}
.filters{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
select,button,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px}
button{cursor:pointer}
button:hover{border-color:var(--red)}
nav{display:flex;gap:2px;padding:0 20px;background:#101018;overflow-x:auto}
nav button{border:0;border-radius:0;background:none;padding:12px 16px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.8px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.act{color:var(--text);border-bottom-color:var(--red)}
main{padding:20px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--panel);border-radius:10px;padding:16px;border-left:4px solid var(--red);min-width:0}
.card.plain{border-left-color:var(--line)}
.card h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.card h2 small{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.kpi .l{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.kpi .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
td{padding:7px 6px;border-bottom:1px solid #2a2a3a;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.r{text-align:right}
.tw{overflow-x:auto}
.purple{color:var(--purple);font-weight:700}
.green{color:var(--green)}
.red{color:var(--red)}
.yellowc{color:var(--yellow)}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--panel2)}
.kno{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 6px;border-radius:5px;background:#fff;color:#111;font-weight:900}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.back{margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.empty{padding:40px;text-align:center;color:var(--muted)}
.advice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.advice div{background:var(--panel2);border-radius:8px;padding:10px 12px}
.advice b{font-size:22px}
#tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:pre}
@media (max-width:640px){.g2{grid-template-columns:1fr}main{padding:12px}header{padding:10px 12px}.filters{margin-left:0}}
/* ================= F1 broadcast-laag ================= */
body{background:
  radial-gradient(ellipse at top,rgba(225,6,0,.10),transparent 55%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px),
  repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px),#0f0f15}
header{background:linear-gradient(100deg,#0b0b10 0,#0b0b10 58%,var(--red) 58.2%,var(--red) 61%,#0b0b10 61.2%);border-bottom:none;position:sticky;overflow:hidden}
header::after{content:"";position:absolute;right:0;top:0;bottom:0;width:150px;pointer-events:none;
  background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/14px 14px;-webkit-mask:linear-gradient(90deg,transparent,#000 75%);mask:linear-gradient(90deg,transparent,#000 75%)}
header>*{position:relative;z-index:1}
.filters{margin-right:150px}
.logo{font-size:26px;letter-spacing:1px}
nav{border-bottom:2px solid var(--red);padding:6px 20px;gap:6px;background:#0b0b10}
nav button{transform:skewX(-14deg);background:#1b1b24;border-bottom:none;font-style:italic;padding:9px 18px}
nav button.act{background:var(--red);color:#fff;box-shadow:0 0 16px rgba(225,6,0,.45)}
nav button:hover:not(.act){background:#262632;color:#fff}
.card{border-left:none;border-top:3px solid var(--red);background:linear-gradient(160deg,#21212c,#16161d);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.card.plain{border-top-color:var(--line)}
.card h2{display:inline-block;background:linear-gradient(90deg,var(--red),#8a0400);padding:3px 14px 3px 10px;transform:skewX(-12deg);font-style:italic;font-weight:900}
.card h2 small{color:#ffd0cd}
.card h2.plainh{background:none;transform:none;padding:0}
.kpi .v{font-style:italic;font-weight:900}
.kpi .l{font-weight:700}
select,button,input{border-radius:0}
button{font-style:italic;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
th{color:#fff;font-style:italic;background:none}
thead tr{background:linear-gradient(90deg,#b00500,#5a0200 45%,transparent 90%)}
.advice div{border-radius:0;border-top:3px solid var(--red);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.advice b{font-style:italic;font-weight:900}
tbody tr:nth-child(odd) td{background:rgba(255,255,255,.02)}
td{border-bottom:1px solid #22222d}
.kno{border-radius:0;transform:skewX(-12deg);font-style:italic}
.pill{border-radius:0;transform:skewX(-12deg);font-style:italic}
.dno{display:inline-block;min-width:36px;text-align:center;font-weight:900;font-style:italic;padding:0 6px;margin-right:8px;transform:skewX(-12deg);font-variant-numeric:tabular-nums}
.dno.sms{background:#fff;color:#111}
.dno.log{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.dno.none{background:transparent}
.who{display:inline-flex;align-items:center;white-space:nowrap}
.who .av{width:24px;height:24px;border-radius:50%;object-fit:cover;margin-right:8px;border:2px solid var(--red);background:#222}
.who .tla{font-style:italic;font-weight:900;letter-spacing:1px;margin-right:8px}
.who .nm{color:var(--muted);font-size:.9em}
.who.big .dno{font-size:26px;min-width:60px}
.who.big .av{width:56px;height:56px}
.who.big .tla{font-size:28px}
.who.big .nm{font-size:16px}
.chart{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
@media (max-width:640px){.filters{margin-right:0}header::after{width:60px}.who .nm{display:none}}
/* ================= volgen ================= */
button.star{background:none;border:0;padding:0 6px;font-size:18px;line-height:1;color:var(--muted);transform:none;font-style:normal;letter-spacing:0;vertical-align:middle}
button.star.on{color:var(--yellow);text-shadow:0 0 8px rgba(255,209,46,.6)}
button.star:hover{color:var(--yellow)}
.fadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fadd input{width:260px}
.livepill{background:var(--green)!important;color:#000;cursor:pointer}
/* ================= live timing ================= */
nav button .ldot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:6px;box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite;vertical-align:1px}
.lbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(100deg,#0b0b10 0,#0b0b10 70%,var(--red) 70.2%,#8a0400);padding:12px 18px;margin-bottom:14px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.lbar .hn{font-size:22px;font-weight:900;font-style:italic;text-transform:uppercase}
.lbar .lc{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.lbar .lc b{color:#fff;font-size:20px;font-style:italic;margin-left:4px}
.lbar .clk{margin-left:auto;font-size:30px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.flag{display:inline-block;padding:3px 12px;font-weight:900;font-style:italic;transform:skewX(-12deg);text-transform:uppercase;font-size:13px}
.flag.lg{background:var(--green);color:#000}.flag.ly{background:var(--yellow);color:#000}.flag.lr{background:var(--red);color:#fff}
.flag.lf{background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/10px 10px;color:#000;text-shadow:0 0 3px #fff}
.flb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(168,85,247,.35),transparent 70%);border-left:4px solid var(--purple);padding:8px 14px;margin-bottom:14px}
.flb .t{color:var(--purple);font-size:22px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.tower td{padding:8px 6px}
.tower tr.me{background:linear-gradient(90deg,rgba(225,6,0,.4),transparent 80%)}
.tower tr.fol{background:linear-gradient(90deg,rgba(59,130,246,.32),transparent 80%)}
.tower tr.me td,.tower tr.fol td{background:transparent!important}
.tower .pos{display:inline-block;min-width:30px;text-align:center;background:#fff;color:#111;font-weight:900;font-style:italic;transform:skewX(-12deg)}
.tower tr:nth-child(1) .pos{background:#F6C343}.tower tr:nth-child(2) .pos{background:#CFD4DA}.tower tr:nth-child(3) .pos{background:#D79A63}
.tower .stripe{display:inline-block;width:4px;height:22px;margin-right:8px;vertical-align:middle}
.pchg{display:inline-block;min-width:26px;font-size:11px;font-weight:900;margin-left:4px}
.pchg.up{color:var(--green)}.pchg.down{color:var(--red)}
.lt{font-weight:700;font-style:italic}
.lt.purple{background:var(--purple);color:#fff;padding:1px 6px}.lt.green{color:var(--green)}.lt.yellow{color:var(--yellow)}
@keyframes newlap{0%{background:rgba(255,255,255,.35)}100%{background:transparent}}
.tower tr.flash td{animation:newlap 1.4s ease-out}
.spark{width:90px;height:24px;vertical-align:middle}
@media (max-width:640px){.tower .hide-s{display:none}.tower td{padding:8px 3px}.lbar .clk{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="logo">KART<span>/</span>ANALYTICS</div>
  <div class="status"><span id="dot" class="dot"></span><span id="stxt">laden…</span></div>
  <div class="filters">
    <select id="track" title="Welke baan"><option value="assen">Assen · Kart en Fun Fabriek</option><option value="emmen">Emmen · Karting Emmen</option><option value="lelystad">Lelystad · Kartcentrum Lelystad</option></select>
    <select id="period"><option value="7d">7 dagen</option><option value="30d">30 dagen</option><option value="90d">90 dagen</option><option value="365d">1 jaar</option><option value="all" selected>Alles</option></select>
    <select id="group"><option>Volwassenen</option><option>Kids</option><option>Alle</option></select>
    <button id="csv" title="Alle rondes downloaden als CSV">⬇ CSV</button>
  </div>
</header>
<nav id="nav">
  <button data-v="overview" class="act">Overzicht</button>
  <button data-v="live" id="navlive">Live timing</button>
  <button data-v="karts">Karts</button>
  <button data-v="drivers">Coureurs</button>
  <button data-v="follow">Volgen</button>
  <button data-v="heats">Heats</button>
  <button data-v="conditions">Omstandigheden</button>
  <button data-v="about">Uitleg</button>
</nav>
<main id="app"></main>
<div id="tip"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const js = (v) => esc(JSON.stringify(v));
const fmt = (ms) => (ms == null || isNaN(ms) ? "–" : (ms / 1000).toFixed(3));
const fmtD = (ms, d = 3) => (ms == null || isNaN(ms) ? "–" : (ms > 0 ? "+" : ms < 0 ? "−" : "±") + Math.abs(ms / 1000).toFixed(d));
const fmtDate = (ts) => (ts ? new Date(ts).toLocaleString("nl-NL", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "–");
const fmtDay = (ts) => new Date(ts).toLocaleDateString("nl-NL", { day: "2-digit", month: "short" });
const ago = (ts) => {
  if (!ts) return "nooit";
  const s = (Date.now() - ts) / 1000;
  if (s < 90) return Math.round(s) + " s geleden";
  if (s < 5400) return Math.round(s / 60) + " min geleden";
  if (s < 172800) return Math.round(s / 3600) + " uur geleden";
  return Math.round(s / 86400) + " dagen geleden";
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("ka_" + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("ka_" + k, JSON.stringify(v)); } catch (_) {} },
};
const state = { view: "overview", arg: null, track: store.get("track", "assen"), period: store.get("period", "all"), group: store.get("group", "Volwassenen"), sort: {} };
const TRACKS = Object.fromEntries([...$("#track").options].map((o) => [o.value, o.textContent.split(" · ")[0]]));
if (!TRACKS[state.track]) state.track = "assen";
$("#track").value = state.track;
$("#period").value = state.period;
$("#group").value = state.group;
// alleen Assen kent de indeling volwassenen/kids
const syncGroup = () => { $("#group").style.display = state.track === "assen" ? "" : "none"; };
syncGroup();
const T = () => `track=${state.track}`;

async function api(p, extra = "") {
  const sep = p.includes("?") ? "&" : "?";
  const r = await fetch(`api/${p}${sep}${T()}&period=${state.period}&group=${encodeURIComponent(state.group)}${extra}`);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ---------------- tooltip ---------------- */
const tip = $("#tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px";
  tip.style.top = e.clientY + 14 + "px";
});

/* ---------------- grafieken (eigen SVG, geen externe bibliotheek) ---------------- */
function niceTicks(min, max, n = 5) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
/**
 * series: [{name,color,points:[{x,y,tip,r}], line:bool, dots:bool, width, dash}]
 * opts: {h, xTime, yFmt, xFmt, yMin, yMax, band:[{y1,y2,color}]}
 */
function chart(series, opts = {}) {
  const W = opts.w || 900, H = opts.h || 300, L = 56, R = 14, T = 12, B = 30;
  const pts = series.flatMap((s) => s.points);
  if (!pts.length) return `<div class="empty">Nog geen gegevens</div>`;
  let x0 = Math.min(...pts.map((p) => p.x)), x1 = Math.max(...pts.map((p) => p.x));
  let ys = pts.map((p) => p.y).sort((a, b) => a - b);
  // robuuste schaal: uitschieters (crashes) niet de hele grafiek laten bepalen
  let y0 = opts.yMin ?? ys[Math.floor(ys.length * 0.0)], y1 = opts.yMax ?? ys[Math.min(ys.length - 1, Math.floor(ys.length * 0.97))];
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  if (x1 === x0) { x0 -= 1; x1 += 1; }
  const sx = (x) => L + ((x - x0) / (x1 - x0)) * (W - L - R);
  const sy = (y) => T + (1 - (Math.min(Math.max(y, y0), y1) - y0) / (y1 - y0)) * (H - T - B);
  const yF = opts.yFmt || ((v) => fmt(v));
  let g = "";
  for (const b of opts.band || []) g += `<rect x="${L}" width="${W - L - R}" y="${sy(b.y2)}" height="${Math.max(0, sy(b.y1) - sy(b.y2))}" fill="${b.color}"/>`;
  for (const v of niceTicks(y0, y1)) g += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#2c2c3e"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${yF(v)}</text>`;
  if (opts.xTime) {
    const span = x1 - x0, n = 6;
    for (let i = 0; i <= n; i++) {
      const v = x0 + (span * i) / n;
      const lbl = span > 3 * 86400000 ? fmtDay(v) : new Date(v).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
      g += `<text x="${sx(v)}" y="${H - 8}" text-anchor="middle">${lbl}</text>`;
    }
  } else {
    for (const v of niceTicks(x0, x1, Math.min(10, Math.ceil(x1 - x0)))) g += `<text x="${sx(v)}" y="${H - 8}" text-anchor="middle">${opts.xFmt ? opts.xFmt(v) : v}</text>`;
  }
  for (const s of series) {
    if (s.line !== false && s.points.length > 1) {
      const d = s.points.map((p, i) => `${i ? "L" : "M"}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join("");
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`;
    }
    if (s.dots) for (const p of s.points) g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${p.r || s.r || 3}" fill="${p.color || s.color}" ${p.y > y1 ? 'opacity=".5"' : ""} data-tip="${esc(p.tip || "")}"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/** horizontale balken; items: [{label, value, tip, color}] ; diverging rond 0 */
function bars(items, opts = {}) {
  if (!items.length) return `<div class="empty">Nog geen gegevens</div>`;
  const W = opts.w || 560, rowH = opts.rowH || 22, L = opts.labelW || 56, R = 64, H = items.length * rowH + 10;
  const vals = items.map((i) => i.value);
  const min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  const span = max - min || 1;
  const sx = (v) => L + ((v - min) / span) * (W - L - R);
  let g = `<line x1="${sx(0)}" x2="${sx(0)}" y1="0" y2="${H}" stroke="#555"/>`;
  items.forEach((it, i) => {
    const y = 5 + i * rowH, a = sx(Math.min(0, it.value)), b = sx(Math.max(0, it.value));
    g += `<g data-tip="${esc(it.tip || "")}" ${it.click ? `style="cursor:pointer" onclick="${it.click}"` : ""}><text x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" style="fill:#fff;font-weight:700">${esc(it.label)}</text>
      <rect x="${a}" y="${y + 3}" width="${Math.max(1, b - a)}" height="${rowH - 6}" rx="3" fill="${it.color || "var(--red)"}"/>
      <text x="${W - R + 8}" y="${y + rowH / 2 + 4}">${opts.fmt ? opts.fmt(it.value) : it.value}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function histogram(values, opts = {}) {
  if (values.length < 3) return `<div class="empty">Te weinig rondes</div>`;
  const s = [...values].sort((a, b) => a - b);
  const lo = s[0], hi = s[Math.floor(s.length * 0.97)];

const kartColor = (k) => { const n = parseInt(String(k).replace(/\D/g, ""), 10); if (isFinite(n)) return KARTC[n % KARTC.length]; let h = 0; for (const c of String(k)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return KARTC[h % KARTC.length]; };
const fmtClock = (ms) => { const n = Number(ms); if (!isFinite(n) || n <= 0) return ""; const t = Math.round(n / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
// per heat bijhouden: plek-wijzigingen, nieuwe rondes, snelste ronde
const lt = { heat: null, pos: {}, laps: {}, flash: new Set(), fl: null };
function liveTrack(L) {
  if (lt.heat !== L.N) Object.assign(lt, { heat: L.N, pos: {}, laps: {}, fl: null });
  lt.flash = new Set();
  const now = Date.now();
  for (const d of L.D) {
    const k = String(d.D || d.N), p = Number(d.P) || 0, l = Number(d.L) || 0;
    const e = lt.pos[k];
    if (!e) lt.pos[k] = { p, delta: 0, at: 0 };
    else if (p && e.p !== p) Object.assign(e, { delta: e.p - p, at: now, p });
    if (lt.laps[k] != null && l > lt.laps[k]) lt.flash.add(k);
    lt.laps[k] = l;
  }
  const bests = L.D.map((d) => Number(d.B)).filter((n) => n > 0);
  const fl = bests.length ? Math.min(...bests) : 0;
  if (fl && (!lt.fl || fl < lt.fl.ms)) { const w = L.D.find((d) => Number(d.B) === fl); lt.fl = { ms: fl, name: w && w.N, kart: w && w.K, at: now }; }
}
const posArrow = (d) => { const e = lt.pos[String(d.D || d.N)]; if (!e || !e.delta || Date.now() - e.at > 20000) return `<span class="pchg"></span>`; return e.delta > 0 ? `<span class="pchg up">▲${e.delta}</span>` : `<span class="pchg down">▼${-e.delta}</span>`; };
function spark(laps) {

  return `<svg class="spark" viewBox="0 0 90 24"><path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="88" cy="${y(v[v.length - 1]).toFixed(1)}" r="2.5" fill="#fff"/></svg>`;
}

    { k: "idx", t: "Kart-effect", r: 1, v: idx, f: (r) => { const v = idx(r); return v == null ? "–" : `<span class="${v < 0 ? "green" : "red"}">${fmtD(v, 2)}</span>${r.seMs ? ` <span class="muted" data-tip="onzekerheid (1 standaardfout)">±${(r.seMs / 1000).toFixed(2)}</span>` : ""}${r.driverCorrectedMs == null ? ' <span class="muted" data-tip="Nog niet in het regressiemodel">*</span>' : ""}`; } },
    { k: "best", t: "Snelste", r: 1, f: (r) => fmt(r.best) },

  <div class="hint" style="margin-top:10px"><b>Kart-effect</b>: hoeveel seconden per ronde deze kart sneller (−) of langzamer (+) is dan gemiddeld, berekend met een regressiemodel dat tegelijk het effect van de coureur, de kart en het rondenummer (opwarmen) schat. ± = onzekerheid; bij weinig rondes wordt een kart naar het gemiddelde getrokken. Alleen schone rondes tellen mee (geen uitrijronde, gele vlag of spin).</div></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Snelste ronde per kart</h2>${bars([...k.karts].filter((x) => x.best).sort((a, b) => a.best - b.best).map((x) => ({ label: "#" + x.kart, value: x.best - k.karts.reduce((m, y) => Math.min(m, y.best || 1e9), 1e9), color: "var(--purple)", tip: `kart ${x.kart}: ${fmt(x.best)}`, click: `go('kart',${js(x.kart)})` })), { fmt: (v) => "+" + fmt(v) })}<div class="hint">Achterstand op de snelste kart.</div></div>
    <div class="card"><h2>Mediaan per kart</h2>${bars([...k.karts].filter((x) => x.median).sort((a, b) => a.median - b.median).map((x) => ({ label: "#" + x.kart, value: x.median - k.overallMedian, color: x.median < k.overallMedian ? "var(--green)" : "var(--red)", tip: `kart ${x.kart}: ${fmt(x.median)}`, click: `go('kart',${js(x.kart)})` })), { fmt: (v) => fmtD(v, 2) })}<div class="hint">Ongecorrigeerd: hangt ook af van wie er toevallig in reed.</div></div>
  </div>`;
}

async function vKart(kart) {
  const [k, all] = await Promise.all([api("kart/" + encodeURIComponent(kart)), api("karts")]);
  const st = all.karts.find((x) => x.kart === kart) || {};
  const clean = k.laps.filter((l) => l.flag === "clean");
  const showAll = store.get("kartAll", false);
  const pts = (showAll ? k.laps : clean).map((l) => ({ x: l.ts, y: l.ms, color: FLAGC[l.flag], r: 2.5, tip: `${fmt(l.ms)} · ${l.driver}\n${fmtDate(l.ts)} · ${l.heat} · ronde ${l.lap}\n${FLAGN[l.flag]}` }));
  const daily = k.daily.map((d) => ({ ...d, x: new Date(d.day + "T12:00").getTime() }));
  // rollend gemiddelde (50 rondes)
  const roll = [];
  for (let i = 0; i < clean.length; i++) { const w = clean.slice(Math.max(0, i - 49), i + 1).map((l) => l.ms); if (i >= 9) roll.push({ x: clean[i].ts, y: median(w) }); }
  const perDriver = new Map();
  for (const l of clean) { if (!perDriver.has(l.driver)) perDriver.set(l.driver, []); perDriver.get(l.driver).push(l.ms); }
  const drows = [...perDriver].map(([driver, a]) => ({ driver, laps: a.length, best: Math.min(...a), median: median(a) }));
  const idx = st.driverCorrectedMs ?? st.heatIndexMs;
  const top = [...clean].sort((a, b) => a.ms - b.ms).slice(0, 10);
  return `
  <button class="back" onclick="history.back()">← Terug</button>
  <div class="grid g4">
    <div class="card kpi"><div class="l">Kart</div><div class="v">${kno(kart)}</div><div class="s">${st.cleanLaps || 0} schone rondes · ${st.heats || 0} heats · ${st.drivers || 0} rijders</div></div>
    <div class="card kpi"><div class="l">Kart-effect</div><div class="v ${idx < 0 ? "green" : "red"}">${fmtD(idx, 2)}</div><div class="s">s per ronde t.o.v. gemiddelde kart</div></div>
    <div class="card kpi"><div class="l">Snelste / mediaan</div><div class="v purple">${fmt(st.best)}</div><div class="s">mediaan ${fmt(st.median)} · gem. ${fmt(st.mean)}</div></div>
    <div class="card kpi"><div class="l">Langzaamste schone ronde</div><div class="v">${fmt(st.worst)}</div><div class="s">spreiding σ ${fmt(st.std)}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Alle rondes over tijd <small><label><input type="checkbox" ${showAll ? "checked" : ""} onchange="store.set('kartAll',this.checked);render()"> ook niet-schone rondes tonen</label></small></h2>
    ${chart([{ name: "rondes", color: "#00D26A", points: pts, line: false, dots: true }, { name: "trend", color: "#fff", points: roll, width: 2.5 }], { xTime: true, h: 320 })}
    <div class="legend"><span><i style="background:#fff"></i>trend (mediaan laatste 50 rondes)</span></div>${showAll ? flagLegend() : ""}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Per dag <small>snelste · mediaan · langzaamste</small></h2>
      ${chart([{ color: "#E10600", points: daily.map((d) => ({ x: d.x, y: d.worst, tip: `${d.day}: langzaamste ${fmt(d.worst)}` })), dots: true, dash: "4 4" }, { color: "#fff", points: daily.map((d) => ({ x: d.x, y: d.median, tip: `${d.day}: mediaan ${fmt(d.median)} (${d.laps} rondes)` })), dots: true }, { color: "#A855F7", points: daily.map((d) => ({ x: d.x, y: d.best, tip: `${d.day}: snelste ${fmt(d.best)}` })), dots: true }], { xTime: true, h: 240, w: 560 })}
      <div class="legend"><span><i style="background:#A855F7"></i>snelste</span><span><i style="background:#fff"></i>mediaan</span><span><i style="background:#E10600"></i>langzaamste</span></div></div>
    <div class="card"><h2>Verdeling rondetijden</h2>${histogram(clean.map((l) => l.ms))}<div class="hint">Een smalle piek = voorspelbare kart. Een lange staart naar rechts kan wijzen op een technisch probleem.</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Rijders in deze kart</h2>${table("kd", [{ k: "driver", t: "Coureur", f: (r) => who(r.driver) }, { k: "laps", t: "Rondes", r: 1 }, { k: "best", t: "Beste", r: 1, f: (r) => fmt(r.best) }, { k: "median", t: "Mediaan", r: 1, f: (r) => fmt(r.median) }], drows.sort((a, b) => a.best - b.best), (r) => `go('driver',${js(r.driver)})`)}</div>
    <div class="card"><h2>Top 10 rondes</h2>${table("kt", [{ k: "ms", t: "Tijd", f: (r) => `<b class="purple">${fmt(r.ms)}</b>` }, { k: "driver", t: "Coureur", f: (r) => who(r.driver) }, { k: "ts", t: "Wanneer", f: (r) => fmtDate(r.ts) }, { k: "heat", t: "Heat" }], top)}</div>
  </div>`;
}

async function vDriver(name) {
  const [d, all, karts] = await Promise.all([api("driver/" + encodeURIComponent(name)), api("drivers"), api("karts")]);
  const st = all.find((x) => x.driver === name) || {};
  const isMe = me() === name, isF = follows().includes(name);
  const myS = me() && !isMe ? all.find((x) => x.driver === me()) : null;
  const heats = d.heats.slice(0, 12).reverse();
  const series = heats.map((h, i) => ({ color: PALETTE[i % PALETTE.length], points: h.laps.filter((l) => l.flag !== "out").map((l) => ({ x: l.lap, y: l.ms, tip: `${h.heat} · ${fmtDate(h.ts)}\nkart ${h.kart} · ronde ${l.lap}: ${fmt(l.ms)}` })), dots: true, r: 2.5, width: 1.5 }));
  const bestPerHeat = d.heats.slice().reverse().map((h) => { const c = h.laps.filter((l) => l.flag === "clean").map((l) => l.ms); return c.length ? { x: h.ts, y: Math.min(...c), tip: `${fmtDate(h.ts)} · kart ${h.kart}: ${fmt(Math.min(...c))}` } : null; }).filter(Boolean);

  <div class="grid g4" style="margin-top:16px">
    <div class="card kpi"><div class="l">Regressie-rating</div><div class="v">${fmt(st.rating)}</div><div class="s">${myS && myS.rating && st.rating ? `jij: ${fmt(myS.rating)} (${fmtD(st.rating - myS.rating)})` : "verwachte ronde in gemiddelde kart"}</div></div>
    <div class="card kpi"><div class="l">Beste ronde</div><div class="v purple">${fmt(st.best)}</div><div class="s">${myS ? `jij: ${fmt(myS.best)} (${fmtD(st.best - myS.best)})` : ""}</div></div>
    <div class="card kpi"><div class="l">Mediaan</div><div class="v">${fmt(st.median)}</div><div class="s">schone rondes</div></div>
    <div class="card kpi"><div class="l">Constantheid σ</div><div class="v">${fmt(st.std)}</div><div class="s">lager = constanter</div></div>

  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Progressie <small>snelste schone ronde per heat</small></h2>${chart([{ color: "#A855F7", points: bestPerHeat, dots: true }], { xTime: true, h: 240, w: 560 })}</div>
    <div class="card"><h2>Rondetijden laatste heats <small>per ronde</small></h2>${chart(series, { h: 240, xFmt: (v) => "R" + v, w: 560 })}</div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Per kart <small>met kart-effect</small></h2>${table("dk", [{ k: "kart", t: "Kart", f: (r) => kno(r.kart) }, { k: "laps", t: "Rondes", r: 1 }, { k: "best", t: "Beste", r: 1, f: (r) => fmt(r.best) }, { k: "median", t: "Mediaan", r: 1, f: (r) => fmt(r.median) }, { k: "eff", t: "Kart-effect", r: 1, v: (r) => kIdx.get(r.kart), f: (r) => { const v = kIdx.get(r.kart); return v == null ? "–" : `<span class="${v < 0 ? "green" : "red"}">${fmtD(v, 2)}</span>`; } }], d.karts, (r) => `go('kart',${js(r.kart)})`)}</div>
    <div class="card"><h2>Heats</h2>${table("dh", [{ k: "ts", t: "Wanneer", f: (r) => fmtDate(r.ts) }, { k: "heat", t: "Heat" }, { k: "kart", t: "Kart", f: (r) => kno(r.kart) }, { k: "n", t: "Rondes", r: 1, v: (r) => r.laps.length, f: (r) => r.laps.length }, { k: "b", t: "Beste", r: 1, v: (r) => Math.min(...r.laps.map((l) => l.ms)), f: (r) => fmt(Math.min(...r.laps.map((l) => l.ms))) }], d.heats.slice(0, 50))}</div>

}

window.addFollow = (inp) => {
  const n = (window._drvNames || []).find((x) => x.toLowerCase() === inp.value.trim().toLowerCase());
  if (!n) return;
  inp.value = "";
  if (!follows().includes(n) && n !== me()) toggleFollow(n);
};
async function vFollow() {
  const myName = me(), fol = follows();
  const people = [...(myName ? [myName] : []), ...fol.filter((n) => n !== myName)];
  const [d, live, ...det] = await Promise.all([
    api("drivers"), fetch("api/live?" + T()).then((r) => r.json()).catch(() => ({})),
    ...people.map((n) => api("driver/" + encodeURIComponent(n)).catch(() => ({ driver: n, heats: [] }))),
  ]);
  window._drvNames = d.map((x) => x.driver);
  const stat = Object.fromEntries(d.map((x) => [x.driver, x]));
  const mine = myName ? stat[myName] : null;
  const L = live.snapshot;
  const onTrack = new Set(L && Array.isArray(L.D) && live.at && Date.now() - live.at < LIVE_STALE_MS ? L.D.map((x) => x.N) : []);
  const color = (n, i) => (n === myName ? "#E10600" : PALETTE[(i % (PALETTE.length - 1)) + 1]);
  const add = `<div class="fadd"><input list="drvlist" placeholder="Coureur toevoegen…" onchange="addFollow(this)" onkeydown="if(event.key==='Enter')addFollow(this)">
    <datalist id="drvlist">${d.filter((x) => x.driver !== myName && !fol.includes(x.driver)).slice(0, 800).map((x) => `<option value="${esc(x.driver)}">`).join("")}</datalist>
    <span class="hint">of klik op ☆ bij een coureur in Coureurs, Live timing of een heat.</span></div>`;
  if (!fol.length) {
    return `<div class="card"><h2>Volgen</h2>${add}<div class="empty">Je volgt nog niemand.<br><span class="hint">Volg vrienden of rivalen om hun cijfers, progressie en onderlinge heats naast die van jou te zien.${myName ? "" : " Stel ook jezelf in via Coureurs → ‘Dit ben ik’."}</span></div></div>`;
  }
  const rows = people.map((n) => ({ ...(stat[n] || {}), driver: n, me: n === myName }));
  const tbl = table("follow", [
    { k: "driver", t: "Coureur", f: (r) => `${star(r.driver)}${who(r.driver)}${r.me ? ' <span class="pill" style="background:var(--red)">JIJ</span>' : ""}${onTrack.has(r.driver) ? ` <span class="pill livepill" onclick="event.stopPropagation();go('live')">● rijdt nu</span>` : ""}` },
    { k: "rating", t: "Regressie", r: 1, f: (r) => (r.rating ? `<b>${fmt(r.rating)}</b>` : "–") },
    { k: "best", t: "Beste", r: 1, f: (r) => `<span class="purple">${fmt(r.best)}</span>` },
    { k: "diff", t: "t.o.v. jou", r: 1, v: (r) => (mine && r.best ? r.best - mine.best : null), f: (r) => (mine && r.best && !r.me ? `<span class="${r.best < mine.best ? "red" : "green"}">${fmtD(r.best - mine.best)}</span>` : "") },
    { k: "median", t: "Mediaan", r: 1, f: (r) => fmt(r.median) },
    { k: "std", t: "Constantheid σ", r: 1, f: (r) => fmt(r.std) },
    { k: "heats", t: "Heats", r: 1, f: (r) => r.heats ?? 0 },
    { k: "last", t: "Laatst gezien", r: 1, f: (r) => (r.last ? ago(r.last) : "niet in deze periode") },
  ], rows, (r) => `go('driver',${js(r.driver)})`);
  // progressie: snelste schone ronde per heat, per persoon
  const series = det.map((x, i) => ({
    color: color(people[i], i), dots: true, r: 3, width: people[i] === myName ? 3 : 1.8,
    points: x.heats.slice().reverse().map((h) => { const c = h.laps.filter((l) => l.flag === "clean").map((l) => l.ms); return c.length ? { x: h.ts, y: Math.min(...c), tip: `${people[i]}\n${fmtDate(h.ts)} · kart ${h.kart}: ${fmt(Math.min(...c))}` } : null; }).filter(Boolean),
  }));
  const legend = `<div class="legend">${people.map((n, i) => `<span><i style="background:${color(n, i)}"></i>${esc(n)}</span>`).join("")}</div>`;
  // laatste heats van gevolgde coureurs
  const feed = det.flatMap((x, i) => x.heats.map((h) => ({ ...h, driver: people[i], best: Math.min(...h.laps.filter((l) => l.flag === "clean").map((l) => l.ms).concat([Infinity])) })))
    .filter((h) => h.driver !== myName).sort((a, b) => b.ts - a.ts).slice(0, 25);
  // onderling: heats waarin jij en een gevolgde coureur samen reden
  let duel = "";
  if (myName && det[0]) {
    const bestOf = (h) => { const c = h.laps.filter((l) => l.flag === "clean").map((l) => l.ms); return c.length ? Math.min(...c) : null; };
    const myHeats = new Map(det[0].heats.map((h) => [h.id, h]));
    const together = det.slice(1).flatMap((x, j) => x.heats.filter((h) => myHeats.has(h.id)).map((h) => ({ id: h.id, ts: h.ts, heat: h.heat, driver: people[j + 1], me: bestOf(myHeats.get(h.id)), them: bestOf(h) }))).filter((r) => r.me && r.them).sort((a, b) => b.ts - a.ts);
    const score = {};
    for (const r of together) { const s = (score[r.driver] = score[r.driver] || { w: 0, l: 0 }); r.me < r.them ? s.w++ : s.l++; }
    duel = `<div class="card" style="margin-top:16px"><h2>Onderling <small>heats waarin jullie samen reden · snelste schone ronde</small></h2>
      ${Object.keys(score).length ? `<div class="advice" style="margin-bottom:12px">${Object.entries(score).map(([n, s]) => `<div><div class="muted">jij vs ${esc(n)}</div><b class="${s.w >= s.l ? "green" : "red"}">${s.w} – ${s.l}</b></div>`).join("")}</div>` : ""}
      ${table("duel", [
        { k: "ts", t: "Wanneer", f: (r) => fmtDate(r.ts) }, { k: "heat", t: "Heat" }, { k: "driver", t: "Tegen", f: (r) => who(r.driver) },
        { k: "me", t: "Jij", r: 1, f: (r) => `<span class="${r.me < r.them ? "purple" : ""}">${fmt(r.me)}</span>` },
        { k: "them", t: "Zij", r: 1, f: (r) => `<span class="${r.them < r.me ? "purple" : ""}">${fmt(r.them)}</span>` },
        { k: "d", t: "Verschil", r: 1, v: (r) => r.me - r.them, f: (r) => `<span class="${r.me < r.them ? "green" : "red"}">${fmtD(r.me - r.them)}</span>` },
      ], together.slice(0, 50), (r) => `go('heat',${r.id})`)}</div>`;
  }
  return `<div class="card"><h2>Volgen <small>${fol.length} gevolgd · deze periode</small></h2>${add}${tbl}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Progressie <small>snelste schone ronde per heat</small></h2>${chart(series, { xTime: true, h: 260, w: 560 })}${legend}</div>
    <div class="card"><h2>Laatste heats van gevolgden</h2>${table("ffeed", [
      { k: "ts", t: "Wanneer", f: (r) => fmtDate(r.ts) }, { k: "driver", t: "Coureur", f: (r) => who(r.driver) }, { k: "heat", t: "Heat" },
      { k: "kart", t: "Kart", f: (r) => kno(r.kart) }, { k: "best", t: "Beste", r: 1, f: (r) => fmt(isFinite(r.best) ? r.best : null) },
    ], feed, (r) => `go('heat',${r.id})`)}</div>
  </div>${duel}`;
}

async function vHeats() {
  const h = await api("heats");
  return `<div class="card"><h2>Heats <small>${h.length} in deze periode</small></h2>${table("heats", [
    { k: "ts", t: "Wanneer", f: (r) => fmtDate(r.ts) }, { k: "name", t: "Heat" }, { k: "drivers", t: "Rijders", r: 1 }, { k: "laps", t: "Rondes", r: 1 },
    { k: "best", t: "Snelste", r: 1, v: (r) => r.best && r.best.ms, f: (r) => (r.best ? `<span class="purple">${fmt(r.best.ms)}</span> <span class="muted">${esc(r.best.driver)} · #${esc(r.best.kart)}</span>` : "–") },
    { k: "yellow", t: "Gele vlag", r: 1, f: (r) => (r.yellow ? `<span class="yellowc">⚑ ${r.yellow}</span>` : "") },
  ], h.slice(0, 300), (r) => `go('heat',${r.id})`)}</div>`;
}

async function vHeat(id) {
  const h = await (await fetch("api/heat/" + id)).json();
  const ps = h.participants.map((p) => ({ ...p, best: Math.min(...p.laps.filter((l) => l.flag !== "out").map((l) => l.ms).concat([1e9])) })).sort((a, b) => a.best - b.best);
  const fastest = ps[0] ? ps[0].best : 0;
  const series = ps.map((p, i) => ({ color: PALETTE[i % PALETTE.length], points: p.laps.map((l) => ({ x: l.lap, y: l.ms, color: l.flag === "clean" ? null : FLAGC[l.flag], tip: `${p.driver} · kart ${p.kart}\nronde ${l.lap}: ${fmt(l.ms)}\n${FLAGN[l.flag]}` })), dots: true, r: 3, width: 1.6 }));
  return `<button class="back" onclick="history.back()">← Terug</button>
  <div class="card"><h2>${esc(h.name)}</h2>${chart(series, { h: 320, xFmt: (v) => "R" + v })}
  <div class="legend">${ps.map((p, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(p.driver)} (#${esc(p.kart)})</span>`).join("")}</div></div>
  <div class="card" style="margin-top:16px"><h2>Uitslag op snelste ronde</h2>${table("hp", [
    { k: "i", t: "#", f: (r, i) => i + 1 }, { k: "driver", t: "Coureur", f: (r) => star(r.driver) + who(r.driver) }, { k: "kart", t: "Kart", f: (r) => kno(r.kart) },
    { k: "best", t: "Beste", r: 1, f: (r) => `<span class="${r.best === fastest ? "purple" : ""}">${fmt(r.best)}</span>` },
    { k: "gap", t: "Verschil", r: 1, v: (r) => r.best - fastest, f: (r) => (r.best === fastest ? "" : fmtD(r.best - fastest)) },
    { k: "laps", t: "Rondes", r: 1, v: (r) => r.laps.length, f: (r) => r.laps.length },
    { k: "all", t: "Rondetijden", f: (r) => r.laps.map((l) => `<span style="color:${l.flag === "clean" ? (l.ms === r.best ? "var(--purple)" : "inherit") : FLAGC[l.flag]}">${fmt(l.ms)}</span>`).join(" ") },
  ], ps, (r) => `go('driver',${js(r.driver)})`)}${flagLegend()}</div>`;
}

async function vConditions() {
  const c = await api("conditions");
  const DAYS = ["ma", "di", "wo", "do", "vr", "za", "zo"];
  const hrs = c.hours.map((h, i) => ({ ...h, i })).filter((h) => h.laps >= 10);
  const ref = median(hrs.map((h) => h.median).filter(Boolean)) || 0;
  return `<div class="grid g2">
    <div class="card"><h2>Ronde-in-heat <small>opwarmen van banden en coureur</small></h2>
      ${chart([{ color: "#E10600", points: c.lapInHeat.map((l) => ({ x: l.lap, y: (l.rel - 1) * 100, tip: `ronde ${l.lap}: ${((l.rel - 1) * 100).toFixed(2)}% (${l.n} rondes)` })), dots: true, width: 2.5 }], { h: 240, yFmt: (v) => v.toFixed(1) + "%", xFmt: (v) => "R" + v, w: 560 })}
      <div class="hint">Procentueel verschil met de mediaan van die heat. Laat zien vanaf welke ronde de banden op temperatuur zijn — handig om te weten wanneer je moet gaan pushen.</div></div>
    <div class="card"><h2>Tijdstip van de dag <small>mediaan</small></h2>
      ${bars(hrs.map((h) => ({ label: h.i + ":00", value: h.median - ref, color: h.median < ref ? "var(--green)" : "var(--red)", tip: `${h.i}:00 – ${h.laps} rondes\nmediaan ${fmt(h.median)}, snelste ${fmt(h.best)}` })), { fmt: (v) => fmtD(v, 2), labelW: 60 })}
      <div class="hint">Verschilt de baan per dagdeel (temperatuur, rubber op de baan, drukte)?</div></div>
    <div class="card"><h2>Dag van de week <small>mediaan</small></h2>
      ${bars(c.weekdays.map((h, i) => ({ ...h, i })).filter((h) => h.laps >= 10).map((h) => ({ label: DAYS[h.i], value: h.median - ref, color: h.median < ref ? "var(--green)" : "var(--red)", tip: `${DAYS[h.i]} – ${h.laps} rondes\nmediaan ${fmt(h.median)}, snelste ${fmt(h.best)}` })), { fmt: (v) => fmtD(v, 2), labelW: 60 })}
      <div class="hint">Let op: op drukke dagen rijden ook meer beginners, dat drukt de mediaan.</div></div>
  </div>`;
}

function vAbout() {
  return `<div class="card"><h2>Hoe werkt het?</h2><div class="hint" style="font-size:15px;max-width:820px">
  <p><b>Banen.</b> Kies rechtsboven de baan: <b>Assen</b> (Kart en Fun Fabriek, via SMS-Timing), <b>Emmen</b> (Karting Emmen, buitenbaan van 1084 m) of <b>Lelystad</b> (Kartcentrum Lelystad, buitenbaan van 735 m), beide via Apex Timing. Alle banen worden tegelijk gelogd en apart geanalyseerd. In Emmen en Lelystad is er geen indeling volwassenen/kids en geen vaste tijdgrens voor schone rondes.</p>
  <p><b>Live timing.</b> Het tabblad <b>Live timing</b> toont de lopende heat zoals op de tv bij de baan: positie (met ▲▼ bij een inhaalactie), laatste en beste ronde, gap naar de leider, interval naar de coureur ervoor en het verloop van de laatste rondes. Paars = snelste ronde van de heat, groen = eigen beste, geel = langzamer. Jij staat rood gemarkeerd, gevolgde coureurs blauw. De pagina ververst elke 1,5 seconde. Stuurt de baan zelf geen gap mee, dan is de gap het verschil in beste ronde.</p>
  <p><b>Volgen.</b> Klik op ☆ naast een coureur (in Coureurs, Live timing, een heat of op de coureurspagina) om hem of haar te volgen, of voeg iemand toe op het tabblad <b>Volgen</b>. Daar zie je de cijfers van jou en je gevolgde coureurs naast elkaar, de progressie in één grafiek, hun laatste heats en de heats waarin jullie samen reden (wie was sneller?). Wie je volgt wordt in deze browser onthouden, per apparaat.</p>
  <p><b>Logger.</b> De server luistert dag en nacht naar de openbare live timing van beide banen en slaat elke voltooide ronde op: tijd, coureur, kart, rondenummer en positie. Hiervoor zijn geen inloggegevens nodig. Valt de verbinding weg, dan maakt hij vanzelf opnieuw verbinding.</p>
  <p><b>Schone rondes.</b> Niet elke ronde zegt iets over de kart. Daarom wordt elke ronde gemarkeerd: <span style="color:${FLAGC.out}">uitrijronde</span> (ronde 1), <span style="color:${FLAGC.yellow}">gele vlag</span> (meer dan de helft van het veld rijdt tegelijk &gt;15% langzamer), <span style="color:${FLAGC.slow}">langzaam</span> (&gt;12% boven het eigen niveau in die heat — spin of botsing — of in Assen langzamer dan 40,0 s) en <span style="color:${FLAGC.clean}">schoon</span>. Statistieken gebruiken alleen schone rondes.</p>
  <p><b>Regressie.</b> Elke schone ronde wordt verklaard als: <i>gemiddelde + niveau van de coureur + effect van de kart + effect van het rondenummer (banden opwarmen)</i>. Het model schat al die effecten tegelijk. Daardoor kun je karts eerlijk vergelijken (los van wie erin reed) en coureurs eerlijk vergelijken (los van welke kart ze kregen). Weer en baanomstandigheden tellen niet mee: in Assen is het een indoorbaan; in Emmen en Lelystad (buiten) kan regen de cijfers beïnvloeden.</p>
  <p><b>Rating</b> = de verwachte rondetijd van een coureur in een gemiddelde kart, op een warme ronde. De coureursranglijst is daarop gesorteerd. <b>Kart-effect</b> = hoeveel seconden per ronde een kart sneller (−) of langzamer (+) is dan gemiddeld. Met weinig rondes trekt het model een waarde naar het gemiddelde, zodat één toevallig goede heat niet meteen bovenaan staat. Reken op een paar weken data voor betrouwbare cijfers.</p>
  <p><b>Beperking.</b> De live timing stuurt alleen de laatste rondetijd. Als de server precies tijdens een ronde offline is, mist die ronde — de rest van de heat wordt gewoon opgeslagen.</p>
  <p class="muted">Versie ${summary ? esc(summary.version) : ""} · database ${summary ? (summary.dbSizeBytes / 1048576).toFixed(1) + " MB" : ""}</p>
  </div></div>`;
}

/* ---------------- router ---------------- */
const VIEWS = { overview: vOverview, live: vLive, follow: vFollow, karts: vKarts, kart: vKart, drivers: vDrivers, driver: vDriver, heats: vHeats, heat: vHeat, conditions: vConditions, about: vAbout };
let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;
  const y = scrollY;
  try {
    const html = await VIEWS[state.view](state.arg);
    if (seq !== renderSeq) return;
    const active = document.activeElement && document.activeElement.tagName === "INPUT" ? document.activeElement.placeholder : null;
    app.innerHTML = html;
    if (active) { const el = [...app.querySelectorAll("input")].find((i) => i.placeholder === active); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
    scrollTo(0, y);
  } catch (e) {
    if (seq === renderSeq) app.innerHTML = `<div class="card"><div class="empty">Kon gegevens niet laden (${esc(e.message)}). Draait de server?</div></div>`;
  }
}
function fromHash() {
  const [v, a] = location.hash.slice(1).split("/");
  state.view = VIEWS[v] ? v : "overview";
  state.arg = a != null ? decodeURIComponent(a) : null;
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("act", b.dataset.v === state.view));
}
window.addEventListener("popstate", () => { fromHash(); render(); });
$("#nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.sort = {}; go(b.dataset.v); } });
$("#period").onchange = (e) => { state.period = e.target.value; store.set("period", state.period); render(); };
$("#track").onchange = async (e) => {
  state.track = e.target.value; store.set("track", state.track); syncGroup();
  // een kart- of coureurspagina van de andere baan bestaat niet: terug naar het overzicht
  if (state.arg != null) go("overview");
  await Promise.all([refreshStatus(), loadMeta()]);
  meta.photos = !!(summary && summary.photos);
  render();
};
$("#group").onchange = (e) => { state.group = e.target.value; store.set("group", state.group); render(); };
$("#csv").onclick = () => { location.href = `api/export.csv?${T()}&period=${state.period}&group=${encodeURIComponent(state.group)}`; };
window.store = store;
fromHash();
Promise.all([refreshStatus(), loadMeta()]).then(() => { meta.photos = !!(summary && summary.photos); render(); });
setInterval(loadMeta, 5 * 60000);
setInterval(refreshStatus, 10000);
// overzicht en live-heat elke 15 s verversen, live timing elke 1,5 s
setInterval(() => { if (state.view === "overview" || state.view === "heat") render(); }, 15000);
setInterval(() => { if (state.view === "live" && !document.hidden) render(); }, 1500);
</script>
</body>
</html>
